<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Atendente Pet Shop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

  /* ============================================================
     CORES — so editar aqui
     ============================================================ */
  :root {
    --ink: #1F3B2C;
    --ink-light: #3D6B4F;
    --paper: #FFFBF3;
    --paper-dim: #F3EBDA;
    --text-dark: #1E2420;
    --text-soft: #5E6A62;
    --accent: #F08A24;
    --accent-dark: #C96A0C;
    --dono-bg: #24262B;
    --dono-card: #33363D;
    --dono-text: #ECEDEF;
    --radius: 18px;
    --card: #FFFFFF;
    --borda: #D8CDB4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #2C5A40; --ink-light: #3D6B4F; --paper: #1A1D1B; --paper-dim: #232724;
      --text-dark: #ECEDE8; --text-soft: #A7B0AA; --card: #2C312D; --borda: #4A5048;
    }
  }
  :root[data-theme="dark"] {
    --ink: #2C5A40; --ink-light: #3D6B4F; --paper: #1A1D1B; --paper-dim: #232724;
    --text-dark: #ECEDE8; --text-soft: #A7B0AA; --card: #2C312D; --borda: #4A5048;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Nunito', sans-serif;
    background: var(--paper);
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 32px;
  }

  .topo { text-align: center; max-width: 420px; margin-bottom: 18px; }
  .topo h1 { font-size: 22px; font-weight: 900; color: var(--text-dark); margin: 0 0 6px; letter-spacing: -0.3px; }
  .topo p { font-size: 14px; color: var(--text-soft); margin: 0; line-height: 1.5; }

  .telefone {
    width: 400px;
    max-width: 100%;
    background: var(--ink);
    border-radius: 32px;
    padding: 10px;
    box-shadow: 0 24px 60px rgba(31, 59, 44, 0.28);
  }

  .tela {
    background: var(--paper-dim);
    border-radius: 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 660px;
    max-height: calc(100vh - 140px);
    min-height: 480px;
  }

  .cabecalho {
    background: var(--ink);
    color: #FFFBF3;
    padding: 16px 20px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; flex-shrink: 0;
  }

  .nome { font-weight: 800; font-size: 15px; }
  .status { font-size: 12px; color: #BFD8C8; display: flex; align-items: center; gap: 5px; }
  .ponto { width: 6px; height: 6px; border-radius: 50%; background: #6FE0A8; }

  .corpo {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  .corpo::-webkit-scrollbar { width: 5px; }
  .corpo::-webkit-scrollbar-thumb { background: #D8CDB4; border-radius: 8px; }

  .bolha {
    max-width: 84%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.48;
    opacity: 0;
    transform: translateY(6px);
    animation: entra 0.32s ease forwards;
    white-space: pre-line;
  }
  @keyframes entra { to { opacity: 1; transform: translateY(0); } }

  .bolha.bot { align-self: flex-start; background: var(--card); color: var(--text-dark); border-bottom-left-radius: 5px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .bolha.user { align-self: flex-end; background: var(--ink-light); color: #fff; border-bottom-right-radius: 5px; }

  .bolha.bastidor {
    align-self: stretch;
    max-width: 100%;
    background: transparent;
    border: 1.5px dashed #C8BC9E;
    color: var(--text-soft);
    font-style: italic;
    font-size: 12.5px;
    padding: 8px 12px;
  }

  .bolha.cena {
    align-self: center;
    background: var(--ink);
    color: var(--paper);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
  }

  .bolha.resumo {
    align-self: flex-start;
    background: var(--card);
    border: 1.5px solid var(--paper-dim);
    font-size: 13.5px;
    line-height: 1.65;
    border-bottom-left-radius: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .resumo-titulo { font-weight: 900; color: var(--accent); display: block; margin-bottom: 3px; }
  .linha-total { font-weight: 900; border-top: 1px dashed #D8CDB4; margin-top: 4px; padding-top: 4px; }

  /* Celular do dono */
  .dono {
    align-self: stretch;
    background: var(--dono-bg);
    color: var(--dono-text);
    border: 1px solid #3A3D44;
    border-radius: 16px;
    padding: 10px 12px 12px;
    font-size: 13.5px;
    line-height: 1.5;
    opacity: 0;
    transform: translateY(6px);
    animation: entra 0.32s ease forwards;
  }
  .dono-rotulo {
    font-size: 11px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase;
    color: #FFB46B; display: block; margin-bottom: 6px;
  }
  .dono-msg { background: var(--dono-card); border-radius: 12px; padding: 9px 12px; white-space: pre-line; }
  .dono-msg + .dono-msg { margin-top: 6px; }
  .dono-msg.resposta { background: #3E6B50; margin-left: auto; width: fit-content; max-width: 85%; }
  .dono .opcoes { margin-top: 8px; max-width: 100%; }
  .dono .opcao-btn { background: var(--dono-card); color: #fff; border-color: #4A4E57; }
  .dono .opcao-btn:hover, .dono .opcao-btn:focus-visible { background: var(--accent); border-color: var(--accent); color: #2B1700; }

  .barra { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .barra span:first-child { width: 120px; flex-shrink: 0; font-size: 12.5px; }
  .barra .cheio { height: 8px; border-radius: 4px; background: var(--accent); }
  .barra span:last-child { font-size: 12px; color: #B8BBC2; }

  .digitando {
    align-self: flex-start; display: flex; gap: 4px; padding: 12px 15px;
    background: var(--paper); border-radius: var(--radius); border-bottom-left-radius: 5px;
  }
  .digitando span { width: 6px; height: 6px; border-radius: 50%; background: #B9B0A0; animation: pulsa 1.1s infinite ease-in-out; }
  .digitando span:nth-child(2) { animation-delay: 0.15s; }
  .digitando span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulsa { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .opcoes {
    display: flex; flex-direction: column; gap: 7px;
    align-self: flex-start; max-width: 90%;
    opacity: 0; animation: entra 0.32s ease forwards;
  }
  .opcao-btn {
    background: var(--card);
    border: 1.5px solid var(--paper-dim);
    color: var(--text-dark);
    font-family: inherit; font-size: 13.5px; font-weight: 700;
    padding: 10px 14px; border-radius: 12px;
    text-align: left; cursor: pointer; transition: all 0.15s;
  }
  .opcao-btn:hover, .opcao-btn:focus-visible { background: var(--ink); color: #fff; border-color: var(--ink); outline: none; }

  .rodape { padding: 12px 14px; background: var(--paper); border-top: 1px solid var(--paper-dim); min-height: 20px; }

  .campo-linha { display: flex; gap: 8px; opacity: 0; animation: entra 0.3s ease forwards; }
  .campo-linha input {
    flex: 1; min-width: 0; padding: 11px 14px; border-radius: 20px;
    border: 1.5px solid var(--paper-dim); font-family: inherit; font-size: 14px;
    outline: none; background: var(--card); color: var(--text-dark);
  }
  .campo-linha input:focus { border-color: var(--ink-light); }
  .campo-linha button {
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: var(--ink); color: #fff; font-size: 16px; cursor: pointer; flex-shrink: 0;
  }

  .cta-final {
    display: block; width: 100%; padding: 13px; border-radius: 14px; border: none;
    background: var(--accent); color: #2B1700; font-family: inherit; font-weight: 900;
    font-size: 15px; cursor: pointer;
    text-align: center; text-decoration: none;
  }
  .cta-final:hover { background: var(--accent-dark); color: #fff; }
  .aviso-demo { text-align: center; font-size: 11.5px; color: var(--text-soft); padding-top: 8px; }

  .legenda { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 14px; font-size: 12px; color: var(--text-soft); }
  .legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .bolha, .opcoes, .campo-linha, .dono { animation: none; opacity: 1; transform: none; }
    .digitando span { animation: none; opacity: 1; }
    .corpo { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header class="topo">
  <h1>Atendente de WhatsApp para pet shop</h1>
  <p>Faça de conta que você é cliente de uma loja. Você também vê o que chega no celular do dono.</p>
</header>

<div class="telefone">
  <div class="tela">
    <div class="cabecalho">
      <div class="avatar" aria-hidden="true">🐾</div>
      <div>
        <div class="nome" id="nomeLoja"></div>
        <div class="status"><span class="ponto"></span> online agora</div>
      </div>
    </div>
    <div class="corpo" id="corpo" aria-live="polite"></div>
    <div class="rodape" id="rodape"></div>
  </div>
</div>

<div class="legenda" aria-hidden="true">
  <span><i style="background:#FFFBF3;border:1px solid #D8CDB4"></i>atendente</span>
  <span><i style="background:#24262B"></i>celular do dono</span>
  <span><i style="border:1.5px dashed #C8BC9E"></i>o que acontece por trás</span>
</div>

<script>
/* ============================================================
   CONFIGURACAO — dados ficticios da demo
   ============================================================ */
const CONFIG = {
  nomeLoja: 'Pet Shop Exemplo',
  whatsappForwes: '5527981218574',
  pedidoMinimoEntrega: 50,
  produtos: [
    { nome: 'Ração Exemplo Cães Adulto 15kg', preco: 189.90, estoque: 12, racao: true },
    { nome: 'Ração Exemplo Gatos 10kg',       preco: 172.90, estoque: 7,  racao: true },
    { nome: 'Areia higiênica 4kg',            preco: 18.90,  estoque: 30 },
    { nome: 'Petisco para cães 500g',         preco: 22.90,  estoque: 20 },
  ],
  bairros: [
    { nome: 'Centro',        taxa: 5 },
    { nome: 'Jardim Bela Vista', taxa: 8 },
  ],
};

const reais = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const espera = ms => new Promise(r => setTimeout(r, ms));

document.getElementById('nomeLoja').textContent = CONFIG.nomeLoja;

const corpo = document.getElementById('corpo');
const rodape = document.getElementById('rodape');
const lead = { nome: '', pet: '', especie: 'cão', telefone: '', loja: '' };
let numeroPedido = 101;
let enderecoGuardado = '';
let taxaGuardada = CONFIG.bairros[0].taxa;

function scrollFim() { corpo.scrollTop = corpo.scrollHeight; }

function add(el) { corpo.appendChild(el); scrollFim(); return el; }

function div(classe, texto) {
  const d = document.createElement('div');
  d.className = classe;
  if (texto !== undefined) d.textContent = texto;
  return d;
}

async function digitando(ms) {
  const d = add(div('digitando'));
  d.innerHTML = '<span></span><span></span><span></span>';
  await espera(ms);
  d.remove();
}

async function bot(texto) {
  await digitando(600 + Math.random() * 350);
  add(div('bolha bot', texto));
}

function user(texto) { add(div('bolha user', texto)); }

async function bastidor(texto) {
  await espera(350);
  add(div('bolha bastidor', '🔍 ' + texto));
  await espera(250);
}

async function cena(texto) {
  await espera(400);
  add(div('bolha cena', texto));
  await espera(500);
}

async function resumo(titulo, linhas, total) {
  await digitando(700);
  const b = div('bolha resumo');
  const t = document.createElement('span');
  t.className = 'resumo-titulo';
  t.textContent = titulo;
  b.appendChild(t);
  linhas.forEach(l => { const s = document.createElement('span'); s.style.display = 'block'; s.textContent = l; b.appendChild(s); });
  if (total) { const s = document.createElement('span'); s.style.display = 'block'; s.className = 'linha-total'; s.textContent = total; b.appendChild(s); }
  add(b);
}

/* Bloco do celular do dono: mensagens + botoes opcionais (o visitante responde como dono) */
async function dono(mensagens, botoes) {
  await espera(500);
  const card = div('dono');
  const rot = document.createElement('span');
  rot.className = 'dono-rotulo';
  rot.textContent = '📲 No celular do dono';
  card.appendChild(rot);
  mensagens.forEach(m => card.appendChild(typeof m === 'string' ? div('dono-msg', m) : m));
  add(card);
  if (!botoes) return null;
  const escolha = await escolhe(botoes, card);
  card.appendChild(div('dono-msg resposta', escolha));
  scrollFim();
  return escolha;
}

function escolhe(opcoes, dentro) {
  return new Promise(resolve => {
    const wrap = div('opcoes');
    opcoes.forEach(op => {
      const btn = document.createElement('button');
      btn.className = 'opcao-btn';
      btn.textContent = op;
      btn.onclick = () => {
        wrap.remove();
        if (!dentro) user(op);
        resolve(op);
      };
      wrap.appendChild(btn);
    });
    (dentro || corpo).appendChild(wrap);
    scrollFim();
    wrap.querySelector('button').focus({ preventScroll: true });
  });
}

function digita(placeholder) {
  return new Promise(resolve => {
    rodape.innerHTML = '';
    const linha = div('campo-linha');
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = placeholder;
    input.setAttribute('aria-label', placeholder);
    input.autocomplete = 'off';
    const btn = document.createElement('button');
    btn.textContent = '➤';
    btn.setAttribute('aria-label', 'Enviar');
    function enviar() {
      const valor = input.value.trim();
      if (!valor) { input.focus(); return; }
      linha.remove();
      user(valor);
      resolve(valor);
    }
    btn.onclick = enviar;
    input.onkeydown = e => { if (e.key === 'Enter') enviar(); };
    linha.append(input, btn);
    rodape.appendChild(linha);
    input.focus();
  });
}

function primeiroNome(bruto) {
  const p = bruto.trim().split(/\s+/)[0].replace(/[^\p{L}'-]/gu, '').slice(0, 20) || 'Amigo';
  return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase();
}

/* ============================================================
   ROTEIROS — cada um mostra uma coisa que o agente real faz
   ============================================================ */

async function roteiroPreco() {
  await bot(`Claro, ${lead.nome}! Qual produto você quer saber?`);
  const opcoes = CONFIG.produtos.map(p => p.nome).concat(['Uma marca que a loja não vende']);
  const escolha = await escolhe(opcoes);
  const p = CONFIG.produtos.find(x => x.nome === escolha);
  if (p) {
    await bot(`Temos sim! ${p.nome} sai por ${reais(p.preco)}. Quer que eu já separe pra você?`);
    await bastidor('preço e estoque vêm da planilha da loja. O dono muda um preço lá e o atendente já responde com o valor novo. A IA nunca inventa preço.');
  } else {
    await bot('Essa eu preciso confirmar com a equipe, tá? Já passei pra eles e te respondem por aqui mesmo. 😊');
    await dono([`🙋 ${lead.nome} perguntou por um produto que não está na planilha. Responda direto no WhatsApp da loja.`]);
    await bastidor('quando o produto não está cadastrado, o atendente não diz "tem" nem "não tem": passa para uma pessoa.');
  }
}

async function roteiroPedido() {
  await bot(`Bora, ${lead.nome}! O que vai ser hoje?`);
  const nome = await escolhe(CONFIG.produtos.map(p => `${p.nome} — ${reais(p.preco)}`));
  const p = CONFIG.produtos.find(x => nome.startsWith(x.nome));
  await bot('Quantas unidades?');
  const qtd = Number((await escolhe(['1', '2', '3'])));
  let subtotal = p.preco * qtd;

  await bot('Vai ser entrega ou retirada na loja?');
  let modo = await escolhe(['🚚 Entrega', '🏪 Retirada na loja']);
  let taxa = 0;
  let destino = 'Retirada na loja';

  if (modo === '🚚 Entrega' && subtotal < CONFIG.pedidoMinimoEntrega) {
    await bot(`Pra entrega, o pedido mínimo é ${reais(CONFIG.pedidoMinimoEntrega)}. Seu pedido deu ${reais(subtotal)}. Prefere retirar na loja?`);
    await escolhe(['Tudo bem, retiro na loja']);
    modo = '🏪 Retirada na loja';
  }

  if (modo === '🚚 Entrega') {
    await bot('Qual o seu bairro?');
    const bairro = await escolhe(CONFIG.bairros.map(b => `${b.nome} (taxa ${reais(b.taxa)})`).concat(['Outro bairro']));
    const b = CONFIG.bairros.find(x => bairro.startsWith(x.nome));
    if (!b) {
      await bot('Esse bairro ainda não está na nossa área de entrega. Vou deixar como retirada na loja e a equipe te chama se der pra combinar outro jeito, ok?');
      await bastidor('a lista de bairros e taxas fica na planilha. O dono acrescenta um bairro e ele já passa a valer.');
    } else {
      taxa = b.taxa;
      await bot('Me passa rua e número?');
      const rua = await digita('Ex: Rua das Flores, 120');
      destino = `${rua} — ${b.nome}`;
      enderecoGuardado = destino;
      taxaGuardada = taxa;
    }
  }

  const total = subtotal + taxa;
  const linhas = [
    `🙍 ${lead.nome}`,
    `📦 ${qtd}x ${p.nome} — ${reais(subtotal)}`,
  ];
  if (taxa) linhas.push(`🚚 Taxa de entrega — ${reais(taxa)}`);
  linhas.push(taxa ? `📍 ${destino}` : '🏪 Retirada na loja');
  await resumo(`🛒 Seu pedido #${numeroPedido}`, linhas, `Total: ${reais(total)}`);
  await bot('Posso confirmar?');
  const ok = await escolhe(['✅ Pode confirmar', '✏️ Quero mudar']);
  if (ok !== '✅ Pode confirmar') {
    await bot('Sem problema! É só me dizer o que muda que eu refaço o resumo.');
    await bastidor('o cliente sempre vê o resumo com o total antes de qualquer coisa chegar no dono.');
    return;
  }
  await bastidor('a conta é feita pelo sistema, não pela IA: preço da planilha + taxa do bairro.');
  await bot('Perfeito! Só um instante que eu confirmo o estoque com a loja. ⏳');

  const pedido = numeroPedido++;
  const resp = await dono(
    [`🛒 Pedido #${pedido} — ${lead.nome}\n${qtd}x ${p.nome}\n${taxa ? 'Entrega: ' + destino : 'Retirada na loja'}\nTotal ${reais(total)}\n\nTem em estoque? Responda sim ou não.`],
    ['sim', 'não']
  );

  if (resp === 'não') {
    await bot(`${lead.nome}, infelizmente esse acabou agora. 😕 A equipe já está vendo uma opção parecida pra você.`);
    await bastidor('se o dono responde "não", o cliente é avisado na hora e ninguém fica esperando.');
    return;
  }

  await bot(`Tem sim! 🎉 Pra finalizar, é só fazer o Pix de ${reais(total)}:\n\nChave: pix@petshopexemplo.com.br\nNome: Pet Shop Exemplo\n\nMe avisa quando pagar.`);
  await escolhe(['💸 Já paguei']);
  await bot('Obrigado! Assim que a loja conferir, te aviso. 🙏');

  await dono([`💰 ${lead.nome} disse que pagou o pedido #${pedido} (${reais(total)}).\nConfira no banco e responda PAGO.`], ['PAGO']);
  await bot(taxa
    ? `Pagamento confirmado! ✅ Seu pedido #${pedido} já vai sair pra entrega.`
    : `Pagamento confirmado! ✅ Seu pedido #${pedido} já está separado esperando você na loja.`);
  await bastidor(`o estoque baixou sozinho na planilha (${p.estoque} → ${p.estoque - qtd}) e a venda entrou no relatório do mês.${taxa ? ' O endereço ficou guardado para a próxima compra.' : ''}`);
  if (p.racao) await bastidor(`como foi ração, o sistema anotou a data. Perto de acabar, o atendente chama ${lead.nome} sozinho (veja "Lembrete antes da ração acabar").`);
}

async function roteiroRecompra() {
  await cena('⏩ 25 dias depois...');
  await bastidor(`ninguém da loja fez nada: o sistema calculou que a ração do ${lead.pet} está perto de acabar.`);
  const racao = CONFIG.produtos.find(p => p.racao && (lead.especie === 'gato' ? p.nome.includes('Gatos') : p.nome.includes('Cães')));
  const end = enderecoGuardado || 'Rua das Flores, 120 — Centro';
  await bot(`Oi, ${lead.nome}! 🐾 A ração do ${lead.pet} deve acabar em uns 5 dias.\nMando a de sempre?\n\n${racao.nome} — ${reais(racao.preco)}\nEntrega em: ${end}`);
  const r = await escolhe(['Sim, manda!', 'Mudou o endereço', 'Ainda tenho, obrigado']);
  if (r === 'Ainda tenho, obrigado') {
    await bot('Combinado! Te chamo de novo mais pra frente. 😊');
    await bastidor('o sistema aprende quanto o saco realmente dura para aquele pet e acerta a data do próximo aviso.');
    return;
  }
  if (r === 'Mudou o endereço') {
    await bot('Me passa o endereço novo?');
    const novo = await digita('Rua, número e bairro');
    enderecoGuardado = novo;
  }
  const taxa = taxaGuardada;
  await resumo(`🛒 Pedido #${numeroPedido}`, [
    `🙍 ${lead.nome} (${lead.pet})`,
    `📦 1x ${racao.nome} — ${reais(racao.preco)}`,
    `🚚 Taxa de entrega — ${reais(taxa)}`,
    `📍 ${enderecoGuardado || end}`,
  ], `Total: ${reais(racao.preco + taxa)}`);
  await dono([`🔁 Recompra pelo lembrete — pedido #${numeroPedido++}\n${lead.nome}: 1x ${racao.nome}\nTem em estoque? Responda sim ou não.`]);
  await bastidor('daqui segue igual a um pedido normal: dono confirma o estoque, cliente paga no Pix, estoque baixa. É venda que a loja perderia para o concorrente ou para o mercado.');
}

async function roteiroPessoa() {
  await bot(`Pode falar, ${lead.nome}. Em que posso ajudar?`);
  const r = await escolhe([
    '💸 Consegue um desconto?',
    '😠 Meu pedido atrasou',
    `🤒 O ${lead.pet} está vomitando, o que eu dou?`,
  ]);
  if (r.startsWith('🤒')) {
    await bot(`Poxa, sinto muito pelo ${lead.pet}. 💚 Sobre saúde eu não posso orientar: o certo é procurar um veterinário o quanto antes. Quer que alguém da loja te passe um contato?`);
    await bastidor('o atendente nunca dá orientação veterinária nem de remédio.');
  } else {
    await bot('Entendi! Vou chamar alguém da equipe pra falar com você agora mesmo. 🙋');
    await dono([`🙋 ${lead.nome} pediu para falar com uma pessoa:\n"${r.slice(2).trim()}"\nResponda direto no WhatsApp da loja.`]);
    await bastidor('reclamação, desconto e pedido de falar com gente vão direto para uma pessoa. Preço e desconto quem decide é o dono, nunca a IA.');
  }
  await bastidor('quando um funcionário responde pelo mesmo WhatsApp da loja, o atendente fica quieto por 2 horas naquela conversa para não atropelar. Dá para religar antes com um comando.');
}

async function roteiroRelatorio() {
  await cena('⏩ Dia 1º do mês...');
  const rel = div('dono-msg');
  const titulo = document.createElement('div');
  titulo.innerHTML = '<b>📊 Relatório de setembro — Pet Shop Exemplo</b>';
  rel.appendChild(titulo);
  [
    'Vendas pelo WhatsApp: R$ 8.430,00',
    'Pedidos: 47 (12 vieram do lembrete de ração)',
    'Clientes que voltaram a comprar: 31',
  ].forEach(t => rel.appendChild(div('', t)));
  const mais = div('', 'Mais vendidos:');
  mais.style.marginTop = '6px';
  rel.appendChild(mais);
  [['Ração Cães Adulto', 100, 18], ['Ração Gatos', 72, 13], ['Areia higiênica', 50, 9], ['Petisco cães', 28, 5]].forEach(([n, w, q]) => {
    const b = div('barra');
    const a = document.createElement('span'); a.textContent = n;
    const c = document.createElement('span'); c.className = 'cheio'; c.style.width = w + 'px';
    const d = document.createElement('span'); d.textContent = q;
    b.append(a, c, d);
    rel.appendChild(b);
  });
  await dono([rel, '🔗 Ver o painel completo']);
  await bastidor('chega todo dia 1º por WhatsApp e por e-mail, com um painel que abre no celular. São números que a loja não tinha: quanto vendeu pelo WhatsApp e o que mais sai. Valores desta tela são de exemplo.');
}

async function roteiroProblema() {
  await cena('⚠️ E se algo der errado?');
  await dono(['⚠️ O atendente não conseguiu ler a planilha às 14:32.\nAté normalizar, responda os clientes direto no WhatsApp da loja.']);
  await bastidor('se a IA ou a planilha falhar, o dono é avisado na hora (no máximo 1 aviso a cada 30 minutos). Nenhum cliente fica sem resposta sem a loja saber.');
}

const MENUS = [
  { rotulo: '🔎 Perguntar preço e estoque',        roteiro: roteiroPreco },
  { rotulo: '🛒 Fazer um pedido (do início ao Pix)', roteiro: roteiroPedido },
  { rotulo: '🔁 Lembrete antes da ração acabar',   roteiro: roteiroRecompra },
  { rotulo: '🙋 Pedir desconto, reclamar, saúde do pet', roteiro: roteiroPessoa },
  { rotulo: '📊 Relatório do mês para o dono',     roteiro: roteiroRelatorio },
  { rotulo: '⚠️ Quando algo dá errado',            roteiro: roteiroProblema },
];
const ROTULO_SAIR = '✅ Já vi o suficiente';
const visitados = new Set();

async function mostraMenu() {
  while (true) {
    const restantes = MENUS.filter(m => !visitados.has(m.rotulo));
    if (restantes.length === 0) break;
    const opcoes = restantes.map(m => m.rotulo);
    if (visitados.size > 0) opcoes.push(ROTULO_SAIR);
    const escolha = await escolhe(opcoes);
    if (escolha === ROTULO_SAIR) break;
    const menu = MENUS.find(m => m.rotulo === escolha);
    visitados.add(menu.rotulo);
    await menu.roteiro();
    if (visitados.size < MENUS.length) await bot(`Quer ver mais alguma coisa, ${lead.nome}?`);
  }
  await encerra();
}

async function encerra() {
  await cena('Fim da demonstração');
  await bot(`Isso foi uma prévia, ${lead.nome}. Na sua loja, o atendente responde 24h com os seus produtos, os seus preços e o seu Pix, e chama o cliente antes da ração acabar.`);
  await bot('Quer ver isso rodando no seu pet shop? Qual o nome da sua loja?');
  lead.loja = await digita('Nome do seu pet shop');
  await bot('E o melhor WhatsApp pra gente conversar?');
  let tel = await digita('Seu WhatsApp com DDD');
  while (tel.replace(/\D/g, '').length < 10) {
    await bot('Não consegui ler o número. Confere se está com DDD?');
    tel = await digita('Ex: 27 99999-9999');
  }
  lead.telefone = tel;
  await bot(`Perfeito! Toca no botão abaixo e me manda a mensagem que eu te mostro como fica na ${lead.loja}. 😊`);

  rodape.innerHTML = '';
  const btn = document.createElement('a');
  btn.className = 'cta-final';
  btn.textContent = '💬 Quero na minha loja';
  const msg = `Olá! Testei a demo do atendente para pet shop e quero saber mais.\nNome: ${lead.nome}\nLoja: ${lead.loja}\nWhatsApp: ${lead.telefone}`;
  btn.href = `https://wa.me/${CONFIG.whatsappForwes}?text=${encodeURIComponent(msg)}`;
  btn.target = '_blank';
  btn.rel = 'noopener';
  const aviso = div('aviso-demo', 'Demonstração Forwes — loja, preços e números são fictícios. Nenhum dado foi salvo.');
  rodape.append(btn, aviso);
}

async function iniciar() {
  await bot(`Oi! 🐾 Aqui é o atendente virtual do ${CONFIG.nomeLoja}.`);
  await bot('Qual é o seu nome?');
  lead.nome = primeiroNome(await digita('Seu nome'));
  await bot(`Prazer, ${lead.nome}! Seu pet é cachorro ou gato?`);
  lead.especie = (await escolhe(['🐶 Cachorro', '🐱 Gato'])).includes('Gato') ? 'gato' : 'cão';
  await bot('E como ele se chama?');
  lead.pet = primeiroNome(await digita('Nome do pet'));
  await bot(`Que nome lindo! 💚 Escolhe o que você quer testar. Os cartões escuros mostram o que chega no celular do dono da loja.`);
  rodape.innerHTML = '';
  await mostraMenu();
}

iniciar();
</script>
